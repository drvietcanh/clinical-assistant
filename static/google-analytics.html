<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JRP0GQLG70"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-JRP0GQLG70', {
    'page_path': window.location.pathname,
    'page_location': window.location.href,
    'page_title': document.title,
    'send_page_view': true
  });
  
  // Track initial page view
  gtag('event', 'page_view', {
    'page_title': document.title,
    'page_location': window.location.href,
    'page_path': window.location.pathname
  });
  
  // Track page views khi navigate trong Streamlit SPA
  (function() {
    let lastPath = window.location.pathname;
    let lastUrl = window.location.href;
    
    function trackPageView() {
      if (typeof gtag !== 'undefined') {
        gtag('config', 'G-JRP0GQLG70', {
          'page_path': window.location.pathname,
          'page_location': window.location.href,
          'page_title': document.title
        });
        gtag('event', 'page_view', {
          'page_title': document.title,
          'page_location': window.location.href,
          'page_path': window.location.pathname
        });
      }
    }
    
    // Track khi URL thay đổi
    const observer = new MutationObserver(function() {
      const currentPath = window.location.pathname;
      const currentUrl = window.location.href;
      if (currentPath !== lastPath || currentUrl !== lastUrl) {
        lastPath = currentPath;
        lastUrl = currentUrl;
        setTimeout(trackPageView, 200);
      }
    });
    
    if (document.body) {
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      });
    }
    
    window.addEventListener('hashchange', trackPageView);
    window.addEventListener('popstate', trackPageView);
  })();
</script>
