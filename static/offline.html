<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1976d2">
    <title>Offline - Clinical Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #1976d2;
        }
        
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .features {
            text-align: left;
            background: #f5f7fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .features h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #1976d2;
        }
        
        .features ul {
            list-style: none;
            padding: 0;
        }
        
        .features li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }
        
        .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4caf50;
            font-weight: bold;
        }
        
        .button {
            display: inline-block;
            background: #1976d2;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            margin: 10px 5px;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .button:hover {
            background: #1565c0;
        }
        
        .button.secondary {
            background: #757575;
        }
        
        .button.secondary:hover {
            background: #616161;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .status.offline {
            background: #ffebee;
            color: #c62828;
        }
        
        .status.online {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Bạn đang offline</h1>
        <p>Không có kết nối internet. Một số tính năng có thể không khả dụng.</p>
        
        <div class="features">
            <h3>✅ Tính năng hoạt động offline:</h3>
            <ul>
                <li>Xem lại kết quả đã cache</li>
                <li>Truy cập drug database đã tải</li>
                <li>Xem calculator definitions</li>
                <li>Đọc protocols đã lưu</li>
            </ul>
        </div>
        
        <div id="status" class="status offline">
            ⚠️ Không có kết nối internet
        </div>
        
        <div style="margin-top: 30px;">
            <button class="button" onclick="window.location.reload()">
                🔄 Thử lại
            </button>
            <button class="button secondary" onclick="goHome()">
                🏠 Về trang chủ
            </button>
        </div>
    </div>
    
    <script>
        // Check online status
        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (navigator.onLine) {
                statusEl.className = 'status online';
                statusEl.textContent = '✅ Đã kết nối internet - Đang tải lại...';
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } else {
                statusEl.className = 'status offline';
                statusEl.textContent = '⚠️ Không có kết nối internet';
            }
        }
        
        // Listen for online/offline events
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        
        // Check status on load
        updateStatus();
        
        // Go home function
        function goHome() {
            window.location.href = '/';
        }
        
        // Periodic check
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
